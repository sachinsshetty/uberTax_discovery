<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ownership Graph + Cycle Detection</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #121212; color: #eee; }
        #mynetwork { width: 100vw; height: 100vh; border: 1px solid #333; }
        
        #header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 15px; text-align: center;
            backdrop-filter: blur(10px);
        }
        .warning {
            background: linear-gradient(90deg, #FF0000, #AA0000);
            color: white; padding: 12px 20px; border-radius: 8px;
            font-weight: bold; font-size: 18px; margin: 10px auto; max-width: 600px;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        #controls {
            position: absolute; top: 80px; left: 20px; z-index: 1000;
            background: rgba(30,30,30,0.95); padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6); border: 1px solid #444;
        }
        input, button, select {
            padding: 10px 14px; margin: 6px; border-radius: 8px; border: none;
            font-size: 14px;
        }
        button {
            background: #4CAF50; color: white; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #45a049; }
        small { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    {% if has_cycles %}
    <div id="header">
        <div class="warning">
            CYCLE DETECTED! {{ cycle_count }} ownership loop(s) found — Possible fraud or data error!
        </div>
    </div>
    {% endif %}

    <div id="controls">
        <h3>Explore Ownership Graph</h3>
        <form action="/graph/visualize" method="get">
            <input type="text" name="entity_type" placeholder="legal or natural" 
                   value="{{ center_entity.split(':')[0] if center_entity else '' }}" required>
            <input type="number" name="entity_id" placeholder="Entity ID" 
                   value="{{ center_entity.split(':')[1] if center_entity else '' }}" required>
            <input type="number" name="depth" placeholder="Depth" value="3" min="1" max="10">
            <button type="submit">Load Graph</button>
        </form>
        <small>Red dashed arrows = ownership cycles</small>
    </div>

    <div id="mynetwork"></div>

    <script>
        const nodes = new vis.DataSet({{ nodes|tojson }});
        const edges = new vis.DataSet({{ edges|tojson }});

        const container = document.getElementById("mynetwork");
        const data = { nodes, edges };

        const options = {
            nodes: {
                shape: "dot",
                size: 25,
                font: { size: 14, color: "#ffffff", strokeWidth: 2, strokeColor: "#000000" },
                borderWidth: 3,
                shadow: true
            },
            edges: {
                font: { align: "middle", size: 13, strokeWidth: 3, strokeColor: "#000000" },
                smooth: { type: "cubicBezier", roundness: 0.5 },
                arrows: { to: { enabled: true, scaleFactor: 1 } },
                shadow: true
            },
            physics: {
                enabled: true,
                barnesHut: {
                    gravitationalConstant: -12000,
                    centralGravity: 0.3,
                    springLength: 200,
                    springConstant: 0.04,
                    damping: 0.9
                },
                stabilization: { iterations: 200 }
            },
            interaction: {
                hover: true,
                zoomView: true,
                dragView: true,
                navigationButtons: true,
                keyboard: true
            },
            layout: { improvedLayout: true }
        };

        const network = new vis.Network(container, data, options);

        // Focus on root node
        {% if center_entity %}
        setTimeout(() => {
            network.focus("{{ center_entity }}", {
                scale: 0.9,
                animation: { duration: 1000, easingFunction: "easeInOutQuad" }
            });
            network.selectNodes(["{{ center_entity }}"]);
        }, 800);
        {% endif %}
    </script>
</body>
</html>
